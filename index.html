<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penny Profiles: banking test personas</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="wordmark">Penny Profiles <span>Test personas</span></p>
      <p class="disclaimer">Random Test data only: these are fictional people and details, never use for real payments</p>
    </header>

    <main class="layout">
      <aside class="controls">
        <form id="controls">
          <label>Country
            <select id="country"></select>
          </label>
          <label>Gender
            <select id="gender">
              <option value="any">Any</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </label>
          <div class="row">
            <label>Min age <input id="minAge" type="number" min="16" max="100" value="18" /></label>
            <label>Max age <input id="maxAge" type="number" min="16" max="100" value="80" /></label>
          </div>
          <label class="switch">
            <input id="latinOnly" type="checkbox" />
            <span>Latin script only<span class="hint">Romanise Chinese, Japanese, Russian and Persian details</span></span>
          </label>
          <label>Seed
            <input id="seed" type="text" inputmode="numeric" placeholder="Random" />
            <span class="hint">Enter a seed to reproduce a persona</span>
          </label>
          <button type="submit" class="primary">Generate persona</button>
        </form>

        <section class="batch">
          <h2>Export a batch</h2>
          <div class="row">
            <label>Count <input id="batchCount" type="number" min="1" max="5000" value="100" /></label>
            <label>Scope
              <select id="batchScope">
                <option value="country">This country</option>
                <option value="all">All countries</option>
              </select>
            </label>
          </div>
          <div class="row">
            <button type="button" id="exportCsv">Download CSV</button>
            <button type="button" id="exportJson">Download JSON</button>
          </div>
        </section>

        <section class="history">
          <h2>Recent personas</h2>
          <ol id="history"></ol>
        </section>
      </aside>

      <section id="persona" class="persona" aria-live="polite"></section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
